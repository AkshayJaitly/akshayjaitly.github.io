<meta property="og:title" content="🪔 Shubh Deepavali from Akshay &amp; Kanika Jaitly">
<meta property="og:description" content="Tap the sky to light it up. Wishing you a Diwali full of light, love and prosperity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Marcellus+SC&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  /* Layout: one centred column — invocation, deities flanking the title, the couple on a lamp-lit ground. Canvases sit fixed behind and above. */
  :root{
    --ink:#0a0507; --maroon:#3a0d16; --wine:#5c1424;
    --gold:#d9a441; --gold-hi:#ffe3a1; --gold-lo:#9a6b1f; --ivory:#f7ecd7; --rose:#e9a3b4;
    --deva:"Tiro Devanagari Hindi","Noto Serif Devanagari","Mangal",serif;
    --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
    --caps:"Marcellus SC","Cormorant Garamond",Georgia,serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--ink);color:var(--ivory)}
  body{font-family:var(--serif);overflow-x:hidden;
       background:radial-gradient(120% 80% at 50% 0%,#2a0a14 0%,transparent 60%),radial-gradient(90% 60% at 50% 110%,var(--wine) 0%,transparent 65%),var(--ink);
       -webkit-tap-highlight-color:transparent}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
  #sky{z-index:0} #ground{z-index:3} #fx{z-index:4}

  /* gold frame */
  .frame{position:fixed;inset:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
         border:1px solid #d9a44199;z-index:5;pointer-events:none}
  .frame::after{content:"";position:absolute;inset:5px;border:1px solid #d9a44144}
  .corner{position:absolute;width:54px;height:54px}
  .corner.tl{top:-1px;left:-1px} .corner.tr{top:-1px;right:-1px;transform:scaleX(-1)}
  .corner.bl{bottom:-1px;left:-1px;transform:scaleY(-1)} .corner.br{bottom:-1px;right:-1px;transform:scale(-1,-1)}

  .page{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;
        padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:28px 0}
  .invoke{font-family:var(--deva);color:var(--gold);font-size:clamp(15px,2.2vw,19px);letter-spacing:.06em;opacity:0;animation:fade 1.2s .2s forwards}

  .hero{display:grid;grid-template-columns:auto minmax(0,620px) auto;align-items:center;gap:clamp(18px,4vw,56px);margin-top:4px;width:100%;justify-content:center}
  .arch{position:relative;width:clamp(150px,15vw,200px);aspect-ratio:3/4.1;opacity:0;animation:rise 1.4s .4s cubic-bezier(.2,.8,.2,1) forwards}
  .arch.r{animation-delay:.6s}
  .arch .glow{position:absolute;inset:-22%;background:radial-gradient(closest-side,#ffcf6a55,transparent 70%);animation:breathe 4s ease-in-out infinite}
  .arch .win{position:absolute;inset:0;border-radius:50% 50% 6px 6px/36% 36% 6px 6px;overflow:hidden;
             border:2px solid var(--gold);box-shadow:0 0 0 5px #0a0507,0 0 0 6px #d9a44188,0 10px 40px #000a;background:#2a0d12}
  .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
  .arch .fallback{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--deva);font-size:64px;color:var(--gold)}
  .arch .cap{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-family:var(--caps);letter-spacing:.2em;font-size:13px;color:var(--gold-hi)}
  .deity{width:100%;height:100%;display:block}
  .deity .halo{transform-box:fill-box;transform-origin:50% 50%;animation:spin 40s linear infinite}
  .deity .sway-l{transform-box:fill-box;transform-origin:100% 100%;animation:sway 3.6s ease-in-out infinite}
  .deity .sway-r{transform-box:fill-box;transform-origin:0% 100%;animation:sway 3.6s ease-in-out infinite reverse}
  .deity .trunk{transform-box:fill-box;transform-origin:50% 0%;animation:trunk 7s ease-in-out infinite}
  .deity .aura{transform-box:fill-box;transform-origin:50% 50%;animation:aura 5s ease-in-out infinite}
  .deity .tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 2.6s ease-in-out infinite}
  .deity .tw:nth-of-type(2n){animation-delay:-1.3s}.deity .tw:nth-of-type(3n){animation-delay:-.7s}
  .deity .gem{animation:gem 3s ease-in-out infinite}
  .deity .ear-l{transform-box:fill-box;transform-origin:100% 50%;animation:earl 2.8s ease-in-out infinite}

        <path d="M256 136 q11 11 22 0" stroke="#c2405a" stroke-width="3" fill="#fff" stroke-linecap="round"/>
        <path d="M266.3 108 L264.8 124.4 Q265.5 127.8 268.9 128.2" stroke="#d09582" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M265.7 109 L264.3 123.6" stroke="#ebb8a3" stroke-width="2.6" fill="none" opacity=".35" stroke-linecap="round"/>
        <path d="M269.6 110 L269.8 122.4" stroke="#fff" stroke-width="1.1" opacity=".65" stroke-linecap="round"/>
        <path d="M263 126.6 q1.3 1.9 3.6 1.8M274 126.6 q-1.3 1.9 -3.6 1.8" stroke="#c48774" stroke-width="1.1" fill="none" stroke-linecap="round"/>

<script>
// ---------- personalise: ?to=Mummy ----------
const q = new URLSearchParams(location.search);
const clean = s => (s||'').replace(/[<>]/g,'').slice(0,40);
if (q.get('to')) document.getElementById('to').textContent = 'Dear ' + clean(q.get('to')) + ',';

// ---------- canvases ----------
const $ = id => document.getElementById(id);
const sky = $('sky'), sc = sky.getContext('2d');
const gnd = $('ground'), gc = gnd.getContext('2d');
const fx = $('fx'), fc = fx.getContext('2d');
let W, H, DPR;
function size(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [sky, gnd, fx]) { c.width = W*DPR; c.height = H*DPR; c.style.width = W+'px'; c.style.height = H+'px'; }
  for (const x of [sc, gc, fc]) x.setTransform(DPR,0,0,DPR,0,0);
  stars = Array.from({length: Math.round(W*H/7000)}, () => ({x:Math.random()*W, y:Math.random()*H, r:.4+Math.random()*1.3, p:Math.random()*6.28, s:.4+Math.random()*1.4}));
  dust = Array.from({length: 46}, () => newDust(true));
  petals = Array.from({length: W < 820 ? 14 : 26}, () => newPetal(true));
}
let stars = [], dust = [];
function newDust(any){ return {x:Math.random()*W, y: any ? Math.random()*H : H+10, vy: -(.15+Math.random()*.4), r:.6+Math.random()*1.6, p:Math.random()*6.28}; }
addEventListener('resize', size); if (window.visualViewport) visualViewport.addEventListener('resize', size);

// ground line follows the stage (so it scrolls with the page on phones)
const stage = $('stage');
function groundInfo(){ const r = stage.getBoundingClientRect(), small = W < 820, bottom = Math.min(r.bottom, H); return {y: bottom - (small ? 44 : 26) - safeB, left: r.left, w: r.width, small}; }
const safeB = (() => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px)'; document.body.appendChild(d); const v = d.getBoundingClientRect().height; d.remove(); return v; })();
function layoutGround(g){
  if (g.small) return {diyas:[.07,.93], anar:[.2,.8], chakri:[.5]};
  return {diyas:[.05,.17,.83,.95,.36,.64], anar:[.11,.89], chakri:[.27,.73]};
}

// ---------- particles ----------
const COLORFUL = ['#ff3b6b','#ffb000','#38d9ff','#7dff5a','#c77dff','#ff6a00','#ffffff','#ff4fd8','#ffe066'];
const GOLDS = ['#ffd27a','#ffe9b3','#f6b93b','#fff6dc','#ffb347'];
const pick = a => a[Math.floor(Math.random()*a.length)];
let P = [];   // sparks
let rockets = [], emitters = [];
let flash = 0, flashCol = '255,220,160';
let smoke = [], petals = [];
const T0 = performance.now();
function newPetal(any){ return {x:Math.random()*W, y: any ? Math.random()*H : -20, vy:.5+Math.random()*.9, vx:(Math.random()-.5)*.4, r:4+Math.random()*4, rot:Math.random()*6.28, vr:(Math.random()-.5)*.06, sw:Math.random()*6.28, c: Math.random()<.55 ? '#ff9a1f' : '#ffc928'}; }

// ---- synthesized firework sounds (off until tapped) ----
let AC = null, soundOn = false;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function noiseBuf(dur){ const a = audio(), b = a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b; }
function boom(dist){
  if (!soundOn || !AC) return; const a = AC, t = a.currentTime + dist;
  const n = a.createBufferSource(); n.buffer = noiseBuf(1.6);
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(60, t+1.2);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.7, t+.02); g.gain.exponentialRampToValueAtTime(.001, t+1.5);
  n.connect(f).connect(g).connect(a.destination); n.start(t); n.stop(t+1.6);
}
function crackle(dur){
  if (!soundOn || !AC) return; const a = AC, t0 = a.currentTime + .25;
  for (let i=0;i<22;i++){ const t = t0 + Math.random()*dur, n = a.createBufferSource(); n.buffer = noiseBuf(.04);
    const h = a.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = 2500 + Math.random()*3000;
    const g = a.createGain(); g.gain.setValueAtTime(.18*Math.random()+.05, t); g.gain.exponentialRampToValueAtTime(.001, t+.04);
    n.connect(h).connect(g).connect(a.destination); n.start(t); n.stop(t+.05); }
}

function spark(o){ P.push(Object.assign({vx:0, vy:0, g:.05, drag:.985, life:1, decay:.012, size:1.8, color:'#fff', glitter:false, trail:false, px:o.x, py:o.y, kids:0}, o)); }

function launch(tx, ty){
  tx = tx ?? W*(.12 + Math.random()*.76);
  ty = ty ?? H*(.1 + Math.random()*.32);
  const x0 = tx + (Math.random()-.5)*W*.12, y0 = H + 10;
  const frames = 46 + Math.random()*12;
  rockets.push({x:x0, y:y0, vx:(tx-x0)/frames, vy:-(y0-ty)/frames*1.35, ty, t:0, color:pick(COLORFUL), kind: Math.floor(Math.random()*6)});
}
function burst(x, y, color, kind){
  const S = Math.min(1.25, Math.max(.7, Math.min(W,H)/700));
  const c2 = pick(COLORFUL);
  flash = Math.min(.35, flash + .22); flashCol = hexRgb(color);
  for (let i=0;i<6;i++) smoke.push({x:x+(Math.random()-.5)*60*S, y:y+(Math.random()-.5)*60*S, r:20+Math.random()*30, a:.10, vx:(Math.random()-.5)*.3, vy:-.1});
  boom(.05 + (1 - y/H)*.15); if (kind === 1 || kind === 5) crackle(1.4);
  if (kind === 0){ // peony with colour change
    for (let i=0;i<110;i++){ const a=Math.random()*6.283, s=(1.6+Math.random()*3.2)*S; spark({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color, color2:c2, decay:.011+Math.random()*.008, size:2.2, trail:true}); }
  } else if (kind === 1){ // golden willow — long hanging glitter
    for (let i=0;i<90;i++){ const a=Math.random()*6.283, s=(1+Math.random()*2.6)*S; spark({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color:pick(GOLDS), g:.035, drag:.975, decay:.0055+Math.random()*.004, size:1.6, glitter:true, trail:true}); }
  } else if (kind === 2){ // double ring
    for (let i=0;i<64;i++){ const a=i/64*6.283; spark({x,y,vx:Math.cos(a)*3.6*S,vy:Math.sin(a)*3.6*S,color, decay:.013, size:2.2, trail:true});
                               spark({x,y,vx:Math.cos(a)*2*S,vy:Math.sin(a)*2*S,color:c2, decay:.015, size:1.8}); }
  } else if (kind === 3){ // crossette — splits in two stages
    for (let i=0;i<14;i++){ const a=i/14*6.283; spark({x,y,vx:Math.cos(a)*3*S,vy:Math.sin(a)*3*S,color, decay:.022, size:2.6, trail:true, kids:5, kidCol:c2}); }
  } else if (kind === 4){ // heart
    for (let i=0;i<90;i++){ const t=i/90*6.283; const hx=16*Math.pow(Math.sin(t),3), hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      spark({x,y,vx:hx*.2*S,vy:hy*.2*S,color:i%3?'#ff3b6b':'#ff9fc4', g:.02, decay:.011, size:2.2, trail:true}); }
  } else { // chrysanthemum with crackle
    for (let i=0;i<120;i++){ const a=Math.random()*6.283, s=(2+Math.random()*2.6)*S; spark({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color, decay:.014, size:1.8, trail:true, crackle:true}); }
  }
}
function hexRgb(h){ const n=parseInt(h.slice(1),16); return `${n>>16&255},${n>>8&255},${n&255}`; }

function anar(xFrac){ emitters.push({type:'anar', xf:xFrac, t:0, dur:300+Math.random()*60}); }
function chakri(xFrac){ emitters.push({type:'chakri', xf:xFrac, t:0, dur:330, ang:0, spin:0}); }

// ---------- drawing ----------
function drawSky(t){
  sc.clearRect(0,0,W,H);
  for (const s of stars){ sc.globalAlpha = .25 + .6*Math.abs(Math.sin(t/1000*s.s + s.p)); sc.fillStyle = '#fff1d6'; sc.beginPath(); sc.arc(s.x,s.y,s.r,0,6.28); sc.fill(); }
  sc.globalAlpha = 1;
  // slow gold mandala behind the title
  const cx = W/2, cy = Math.min(H*.32, 300), R = Math.min(W,H)*.42;
  sc.save(); sc.translate(cx, cy); sc.rotate(t/60000); sc.strokeStyle = 'rgba(217,164,65,.09)'; sc.lineWidth = 1;
  for (let k=0;k<3;k++){ const r = R*(.45+k*.27), n = 12 + k*8;
    for (let i=0;i<n;i++){ const a=i/n*6.283; sc.beginPath(); sc.ellipse(Math.cos(a)*r*.62, Math.sin(a)*r*.62, r*.42, r*.13, a, 0, 6.28); sc.stroke(); } }
  sc.beginPath(); sc.arc(0,0,R,0,6.28); sc.stroke(); sc.restore();
  // rising gold dust
  for (const d of dust){ d.y += d.vy; d.x += Math.sin(t/1500 + d.p)*.2; if (d.y < -10) Object.assign(d, newDust(false));
    sc.globalAlpha = .35 + .35*Math.sin(t/600 + d.p); sc.fillStyle = '#ffd88a'; sc.beginPath(); sc.arc(d.x,d.y,d.r,0,6.28); sc.fill(); }
  sc.globalAlpha = 1;
  // smoke left behind by bursts
  for (let i = smoke.length-1; i >= 0; i--){ const m = smoke[i]; m.x += m.vx; m.y += m.vy; m.r += .35; m.a *= .992;
    if (m.a < .004){ smoke.splice(i,1); continue; }
    const sg = sc.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r); sg.addColorStop(0,`rgba(200,170,190,${m.a})`); sg.addColorStop(1,'rgba(200,170,190,0)');
    sc.fillStyle = sg; sc.beginPath(); sc.arc(m.x,m.y,m.r,0,6.28); sc.fill(); }
  // falling marigold petals
  for (const pt of petals){ pt.y += pt.vy; pt.sw += .02; pt.x += pt.vx + Math.sin(pt.sw)*.5; pt.rot += pt.vr; if (pt.y > H+20) Object.assign(pt, newPetal(false));
    sc.save(); sc.translate(pt.x, pt.y); sc.rotate(pt.rot); sc.scale(1, Math.abs(Math.cos(pt.sw*1.3))*.7+.3);
    sc.fillStyle = pt.c; sc.globalAlpha = .85; sc.beginPath(); sc.ellipse(0,0,pt.r,pt.r*.55,0,0,6.28); sc.fill(); sc.restore(); }
  sc.globalAlpha = 1;
  if (flash > .005){ const gr = sc.createRadialGradient(W/2,0,0,W/2,0,Math.max(W,H)); gr.addColorStop(0,`rgba(${flashCol},${flash*.45})`); gr.addColorStop(1,`rgba(${flashCol},0)`); sc.fillStyle = gr; sc.fillRect(0,0,W,H); flash *= .93; }
}

function drawGround(t, g){
  gc.clearRect(0,0,W,H);
  // ground glow strip
  const gg = gc.createLinearGradient(0, g.y-40, 0, g.y+40); gg.addColorStop(0,'rgba(255,170,60,0)'); gg.addColorStop(.6,'rgba(255,150,50,.10)'); gg.addColorStop(1,'rgba(90,20,36,.0)');
  gc.fillStyle = gg; gc.fillRect(0, g.y-40, W, 80);
  gc.strokeStyle = 'rgba(217,164,65,.35)'; gc.lineWidth = 1; gc.beginPath(); gc.moveTo(g.left+20, g.y+10); gc.lineTo(g.left+g.w-20, g.y+10); gc.stroke();
  const L = layoutGround(g), k = g.small ? .62 : .8;
  const order = L.diyas.map((f,i)=>[f,i]).sort((a,b)=>a[0]-b[0]);
  order.forEach(([f,i], n) => drawDiya(g.left + f*g.w, g.y+4, k, t, i, Math.min(1, Math.max(0, (performance.now() - T0 - 500 - n*260)/450))));
  for (const e of emitters){ const x = g.left + e.xf*g.w;
    if (e.type==='anar') drawPot(x, g.y+6, k); else drawWheel(x, g.y-2, e.ang, k); }
  // idle pots/wheels when nothing is lit
  L.anar.forEach(f => { if (!emitters.some(e => e.type==='anar' && e.xf===f)) drawPot(g.left+f*g.w, g.y+6, k); });
}
function drawDiya(x, y, k, t, i, lit){
  gc.save(); gc.translate(x,y); gc.scale(k,k);
  const f = (1 + .12*Math.sin(t/110 + i*1.7) + .05*Math.sin(t/47 + i)) * (lit ?? 1);
  const glow = gc.createRadialGradient(0,-24,0,0,-24,70*f); glow.addColorStop(0,'rgba(255,190,80,.55)'); glow.addColorStop(1,'rgba(255,140,30,0)');
  gc.fillStyle = glow; gc.beginPath(); gc.arc(0,-24,70*f,0,6.28); gc.fill();
  const fl = gc.createLinearGradient(0,-8,0,-50*f); fl.addColorStop(0,'#ff6a00'); fl.addColorStop(.55,'#ffc300'); fl.addColorStop(1,'#fffbe0');
  if (f > .02){ gc.fillStyle = fl; gc.beginPath(); gc.moveTo(-9,-8); gc.quadraticCurveTo(3*Math.sin(t/90+i), -54*f, 9, -8); gc.quadraticCurveTo(0,-1,-9,-8); gc.fill(); }
  const body = gc.createLinearGradient(-40,0,40,0); body.addColorStop(0,'#8a5a1c'); body.addColorStop(.45,'#f2c766'); body.addColorStop(1,'#7a4c14');
  gc.fillStyle = body; gc.beginPath(); gc.moveTo(-42,-6); gc.quadraticCurveTo(0,42,42,-6); gc.closePath(); gc.fill();
  gc.fillStyle = '#5a3a10'; gc.beginPath(); gc.ellipse(0,-6,42,6.5,0,0,6.28); gc.fill();
  gc.fillStyle = '#ffe3a1'; [-18,0,18].forEach(dx => { gc.beginPath(); gc.arc(dx, 8+(dx?0:3), 2.4, 0, 6.28); gc.fill(); });
  gc.restore();
}
function drawPot(x, y, k){
  gc.save(); gc.translate(x,y); gc.scale(k,k);
  const b = gc.createLinearGradient(-18,0,18,0); b.addColorStop(0,'#5c1424'); b.addColorStop(.5,'#b23a52'); b.addColorStop(1,'#4a0f1c');
  gc.fillStyle = b; gc.beginPath(); gc.moveTo(-8,-34); gc.lineTo(8,-34); gc.quadraticCurveTo(24,-8,16,0); gc.lineTo(-16,0); gc.quadraticCurveTo(-24,-8,-8,-34); gc.fill();
  gc.strokeStyle = '#d9a441'; gc.lineWidth = 2; gc.beginPath(); gc.moveTo(-18,-12); gc.lineTo(18,-12); gc.stroke();
  gc.restore();
}
function drawWheel(x, y, ang, k){
  gc.save(); gc.translate(x,y); gc.scale(k,k); gc.rotate(ang);
  const glow = gc.createRadialGradient(0,0,0,0,0,26); glow.addColorStop(0,'rgba(255,240,200,.95)'); glow.addColorStop(1,'rgba(255,170,60,0)');
  gc.fillStyle = glow; gc.beginPath(); gc.arc(0,0,26,0,6.28); gc.fill();
  gc.strokeStyle = '#ffe3a1'; gc.lineWidth = 3; gc.beginPath(); for (let a=0;a<12;a+=.2){ const r=2+a*1.1; gc.lineTo(Math.cos(a)*r, Math.sin(a)*r); } gc.stroke();
  gc.restore();
}

function stepEmitters(g){
  const L = layoutGround(g), k = g.small ? .62 : .8;
  for (let i = emitters.length-1; i >= 0; i--){
    const e = emitters[i]; e.t++;
    const x = g.left + e.xf*g.w, life = e.t/e.dur, env = Math.sin(Math.min(1,life)*Math.PI);
    if (e.type === 'anar'){
      const y = g.y + 6 - 34*k, n = Math.round(10*env) + 2, H0 = (g.small ? 7.5 : 9.5) * (.55 + .45*env);
      for (let j=0;j<n;j++){ const sp = H0*(.6+Math.random()*.5), a = -Math.PI/2 + (Math.random()-.5)*.55;
        spark({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:.16, drag:.99, decay:.016+Math.random()*.012, size:1.4+Math.random()*1.2,
               color: Math.random()<.12 ? pick(['#7dff5a','#ff4fd8','#38d9ff']) : pick(['#fff6dc','#ffd27a','#ffb347','#ffffff']), glitter: Math.random()<.4, trail:true}); }
    } else {
      e.spin = Math.min(.55, e.spin + .02) * (life > .85 ? .97 : 1); e.ang += e.spin;
      const y = g.y - 2, n = Math.round(9*env) + 1;
      for (let j=0;j<n;j++){ const a = e.ang + j/n*6.283, r = 10*k, tx = -Math.sin(a), ty = Math.cos(a), sp = 3.5 + Math.random()*3;
        spark({x:x+Math.cos(a)*r, y:y+Math.sin(a)*r, vx:tx*sp + Math.cos(a)*.6, vy:ty*sp + Math.sin(a)*.6 - .5, g:.12, drag:.96, decay:.03+Math.random()*.02, size:1.5,
               color: pick(['#fff6dc','#ffd27a','#7dff5a','#ff4fd8','#ffe066','#38d9ff']), trail:true}); }
    }
    if (e.t >= e.dur) emitters.splice(i,1);
  }
}

function phuljhari(id){
  const el = document.getElementById(id); if (!el) return; const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > H) return;
  const x = r.left + r.width/2, y = r.top + r.height/2;
  for (let j=0;j<5;j++){ const a = Math.random()*6.283, sp = .8 + Math.random()*3.2;
    spark({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, g:.03, drag:.93, decay:.05+Math.random()*.05, size:1+Math.random()*1.1, color: Math.random()<.7?'#fffbe8':'#ffd27a', branch: Math.random()<.18}); }
  const glow = fc.createRadialGradient(x,y,0,x,y,22); glow.addColorStop(0,'rgba(255,250,225,.9)'); glow.addColorStop(1,'rgba(255,220,140,0)');
  fc.fillStyle = glow; fc.beginPath(); fc.arc(x,y,22,0,6.28); fc.fill();
}

function drawFx(g){
  fc.globalCompositeOperation = 'destination-out'; fc.fillStyle = 'rgba(0,0,0,.28)'; fc.fillRect(0,0,W,H);
  fc.globalCompositeOperation = 'lighter';
  // rockets
  for (let i = rockets.length-1; i >= 0; i--){
    const r = rockets[i]; r.t++; r.x += r.vx; r.y += r.vy; r.vy *= .972; r.vx += Math.sin(r.t/3)*.05;
    fc.fillStyle = '#fff3d0'; fc.beginPath(); fc.arc(r.x, r.y, 2.2, 0, 6.28); fc.fill();
    spark({x:r.x, y:r.y, vx:(Math.random()-.5)*.5, vy:.8+Math.random(), g:.02, decay:.05, size:1.4, color:'#ffb347', glitter:true});
    if (r.y <= r.ty || r.vy > -1.2){ burst(r.x, r.y, r.color, r.kind); rockets.splice(i,1); }
  }
  phuljhari('tipHim'); phuljhari('tipHer');
  // sparks
  for (let i = P.length-1; i >= 0; i--){
    const p = P[i]; p.px = p.x; p.py = p.y;
    p.vx *= p.drag; p.vy = p.vy*p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.kids && p.life < .55){ for (let k=0;k<p.kids;k++){ const a=Math.random()*6.283, s=1.5+Math.random()*1.5; spark({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color:p.kidCol,decay:.025,size:1.8,trail:true}); } p.kids = 0; }
    if (p.branch && Math.random()<.25){ const a=Math.random()*6.283; spark({x:p.x,y:p.y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,g:.02,drag:.9,decay:.09,size:.9,color:'#fffbe8'}); }
    if (p.life <= 0 || p.y > H+20){ P.splice(i,1); continue; }
    let col = p.color; if (p.color2 && p.life < .5) col = p.color2;
    let a = p.life; if (p.glitter) a *= Math.random()<.5 ? 1 : .15; if (p.crackle && p.life < .3) a *= Math.random()<.35 ? 1.4 : 0;
    fc.globalAlpha = Math.min(1, a);
    if (p.trail){ fc.strokeStyle = col; fc.lineWidth = p.size*Math.max(.4,p.life); fc.lineCap = 'round'; fc.beginPath(); fc.moveTo(p.px - p.vx*1.5, p.py - p.vy*1.5); fc.lineTo(p.x, p.y); fc.stroke(); }
    else { fc.fillStyle = col; fc.beginPath(); fc.arc(p.x, p.y, p.size*(.5+p.life*.6), 0, 6.28); fc.fill(); }
  }
  fc.globalAlpha = 1; fc.globalCompositeOperation = 'source-over';
  if (P.length > 6000) P.splice(0, P.length - 6000);
}

// ---------- loop & choreography ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastSky = 0, nextSky = 900, lastGround = 0, nextGround = 1500, turn = 0;
function frame(t){
  const g = groundInfo();
  drawSky(t); stepEmitters(g); drawGround(t, g); drawFx(g);
  if (!reduce){
    if (t - lastSky > nextSky){ lastSky = t; nextSky = 1300 + Math.random()*1800; launch(); if (Math.random()<.35) setTimeout(() => launch(), 260); }
    if (t - lastGround > nextGround && emitters.length < 2){ lastGround = t; nextGround = 4200 + Math.random()*2500;
      const L = layoutGround(g); turn++; if (turn % 2) anar(pick(L.anar)); else chakri(pick(L.chakri)); }
  }
  requestAnimationFrame(frame);
}

// ---------- interaction ----------
addEventListener('pointerdown', e => {

});
$('b-sky').addEventListener('click', () => { const ks=[0,1,2,3,4,5]; for (let i=0;i<9;i++) setTimeout(() => { launch(); }, i*170); });
$('b-anar').addEventListener('click', () => layoutGround(groundInfo()).anar.forEach(f => anar(f)));
$('b-chakri').addEventListener('click', () => layoutGround(groundInfo()).chakri.forEach(f => chakri(f)));

const music = $('m-toggle'), player = $('player');
// ---- in-page aarti: original ~14s harmonium + tanpura + temple bell rendition of the traditional tune ----
let aartiStop = null;
function playAarti(mode, song){
  const flute = mode === 'flute', naav = song === 'mantra';
  const a = audio(); if (!a) return null; if (a.state === 'suspended') a.resume();
  const t0 = a.currentTime + .08, SA = naav ? 261.63 : 277.18, beat = naav ? .56 : .42;
  // Om Jai Lakshmi Mata, as given: key of C#
  const HZ = {As3:233.08, C4:261.63, D4:293.66, E4:329.63, G4:392.00, Ds4:311.13, F4:349.23, Fs4:369.99, Gs4:415.30, As4:466.16, B4:493.88, Cs5:554.37, Ds5:622.25};
  const n = (list, last=1, tail=1.5) => list.map((x,i) => [x, i === list.length-1 ? last : .5]);
  const L1 = [...n(['Fs4','Fs4','Fs4','Fs4','Gs4','Fs4']), ...n(['F4','Fs4','Gs4'],1.5)];                                   // Om Jai Lakshmi Mata
  const L2 = [...n(['Gs4','As4','B4','Cs5','Ds5','Cs5']), ...n(['B4','As4','B4','Gs4'],1.5)];                               // Maiya Jai Lakshmi Mata
  const L3 = [...n(['Gs4','As4','Gs4','As4','Cs5','B4','B4','B4','B4','As4']), ...n(['Gs4','As4','Gs4','Fs4','Fs4'],1.5)];  // Tumko / Maiya ji ko nishdin sevat
  const L4 = [...n(['F4','Fs4','Gs4','As4','Gs4']), ...n(['Fs4','F4','Fs4','Ds4'],1.5)];                                    // Hari Vishnu Vidhata
  let tune = [...L1, ...L2, ...L3, ...L3, ...L4, ...L1.slice(0,-3), ['F4',.75], ['Fs4',.75], ['Gs4',4]];
  let cycles = [];
  if (naav){
    // ISKCON kirtan: Prabhupada's simple four-note maha-mantra tune (Sa Re Ga Ma), speeding up each round
    const K1 = ['D4','E4','F4','F4','E4','D4','E4','D4'].map(x => [x,.5]);   // Hare Krishna Hare Krishna / Hare Rama Hare Rama
    const K2 = [['E4',.5],['D4',.5],['C4',.5],['D4',.5],['E4',.5],['D4',.5],['C4',1]]; // Krishna Krishna Hare Hare / Rama Rama Hare Hare
    const round = f => [...K1, ...K2, ...K1, ...K2].map(([x,b]) => [x, b*f]);
    tune = []; let at = 0;
    for (const f of [1, .74, .56]){ cycles.push({at, f}); const r = round(f); tune.push(...r); at += 16*f; }
    tune.push(['D4',.6], ['C4',4]);
  }
  const total = tune.reduce((n,[,b]) => n+b, 0) * beat;
  const out = a.createGain(); out.gain.setValueAtTime(.0001, t0); out.gain.exponentialRampToValueAtTime(.9, t0+.4);
  out.gain.setValueAtTime(.9, t0+total-.6); out.gain.exponentialRampToValueAtTime(.0001, t0+total+1.6); out.connect(a.destination);
  const nodes = [];
  const verbIn = a.createGain(); verbIn.gain.value = flute ? .42 : 0;
  if (flute){
    const len = Math.round(a.sampleRate*2.4), ir = a.createBuffer(2, len, a.sampleRate);
    for (let ch=0; ch<2; ch++){ const dd = ir.getChannelData(ch); for (let i=0;i<len;i++) dd[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
    const cv = a.createConvolver(); cv.buffer = ir; const wet = a.createGain(); wet.gain.value = .55;
    verbIn.connect(cv).connect(wet).connect(out);
  }
  if (!flute){
    // tanpura drone: Sa and Pa
    for (const [f,v] of [[SA/2,.10],[SA*3/4,.06],[SA,.04]]){
      const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f; lp.type = 'lowpass'; lp.frequency.value = 900; g.gain.value = v;
      o.connect(lp).connect(g).connect(out); o.start(t0); o.stop(t0+total+1.8); nodes.push(o);
    }
  } else {
    // plucked tanpura (Pa Sa Sa Sa-low) with jawari buzz, cycling under the flute
    const pluck = (f, at, v) => {
      const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), bp = a.createBiquadFilter(), lp = a.createBiquadFilter();
      o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f*1.003;
      bp.type = 'bandpass'; bp.Q.value = 2.5; bp.frequency.setValueAtTime(f*9, at); bp.frequency.exponentialRampToValueAtTime(f*3, at+1.8);
      lp.type = 'lowpass'; lp.frequency.value = 3200;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at+.012); g.gain.exponentialRampToValueAtTime(.0001, at+2.6);
      o.connect(bp); o2.connect(bp); bp.connect(lp).connect(g); g.connect(out); g.connect(verbIn);
      for (const x of [o,o2]){ x.start(at); x.stop(at+2.7); nodes.push(x); }
    };
    const strings = [[SA*3/4,.055],[SA,.05],[SA,.045],[SA/2,.07]];
    for (let ct = t0, k = 0; ct < t0+total+.5; ct += .55, k++) pluck(strings[k%4][0], ct, strings[k%4][1]);
  }
  // harmonium melody (two reeds, slight detune + bellows swell)
  let t = t0;
  let prev = null;
  for (const [i,[n,b]] of tune.entries()){
    const f = HZ[n], d = b*beat, last = i === tune.length-1;
    if (flute){
      // wooden bansuri: warm low register, soft overtones, body resonance, airy breath, slow vibrato, hall reverb
      const F = f, from = prev || F, gl = Math.min(.05, d*.2);
      const SC = ['As3','C4','D4','Ds4','F4','Fs4','G4','Gs4','As4','B4','Cs5','Ds5'], up = HZ[SC[Math.min(SC.indexOf(n)+1, SC.length-1)]] || F*1.12;
      const kan = b >= 1 && i > 0;
      const body = a.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 850; body.Q.value = 1.1; body.gain.value = 5;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .9;
      const g = a.createGain();
      const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 4.3;
      lg.gain.setValueAtTime(0, t); lg.gain.setValueAtTime(0, t + Math.min(.3, d*.5)); lg.gain.linearRampToValueAtTime(F*.0055, t + Math.min(.7, d*.9)); lfo.connect(lg);
      for (const [mul, type, v] of [[1,'sine',1],[1,'triangle',.12],[2,'sine',.18],[3,'sine',.05]]){
        const o = a.createOscillator(), og = a.createGain(); o.type = type; og.gain.value = v;
        o.frequency.setValueAtTime(from*mul, t); o.frequency.exponentialRampToValueAtTime(F*mul, t+gl);
        const lm = a.createGain(); lm.gain.value = mul; lg.connect(lm); lm.connect(o.frequency);
        o.connect(og).connect(g); o.start(t); o.stop(t+d+.15); nodes.push(o);
      }
      const peak = .2 * (last ? 1.35 : 1);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak*.7, t+.05); g.gain.exponentialRampToValueAtTime(peak, t+Math.min(.25, d*.5));
      g.gain.setValueAtTime(peak*.95, t+d*.82); g.gain.exponentialRampToValueAtTime(.0001, t+d+.12);
      g.connect(body).connect(lp); lp.connect(out); lp.connect(verbIn);
      // breath: tuned air under the tone + a short chiff at the start
      const nz = a.createBufferSource(); nz.buffer = noiseBuf(d+.15);
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = F*2; bp.Q.value = 2.2;
      const ng = a.createGain(); ng.gain.setValueAtTime(.0001, t); ng.gain.exponentialRampToValueAtTime(.085, t+.025); ng.gain.exponentialRampToValueAtTime(.026, t+.16);
      ng.gain.setValueAtTime(.026, t+d*.8); ng.gain.exponentialRampToValueAtTime(.0001, t+d+.1);
      nz.connect(bp).connect(ng); ng.connect(out); ng.connect(verbIn);
      lfo.start(t); lfo.stop(t+d+.15); nz.start(t); nz.stop(t+d+.15); nodes.push(lfo, nz);
    } else {
      for (const det of [0, 4]){
        const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
        o.type = det ? 'square' : 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        lp.type = 'lowpass'; lp.frequency.value = 2200; lp.Q.value = .7;
        const peak = (det ? .05 : .09) * (last ? 1.45 : 1);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+.05); g.gain.setValueAtTime(peak*.85, t+d*.8); g.gain.exponentialRampToValueAtTime(.0001, t+d+.05);
        o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t+d+.1); nodes.push(o);
      }
    }
    prev = f; t += d;
  }
  // temple bell (ghanti): inharmonic partials, every 2 bars
  for (let bt = t0; bt < t0+total; bt += beat*4){
    for (const [mul,v,dec] of [[1,.12,2.4],[2.76,.06,1.4],[5.4,.035,.8],[8.9,.02,.5]]){
      const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 1180*mul/2.76;
      g.gain.setValueAtTime(.0001, bt); g.gain.exponentialRampToValueAtTime(v, bt+.005); g.gain.exponentialRampToValueAtTime(.0001, bt+dec);
      o.connect(g).connect(out); o.start(bt); o.stop(bt+dec+.05); nodes.push(o);
    }
  }
  if (cycles.length){
    const mri = (at, low, v) => {   // mridanga: low 'dha' with pitch bend, high 'ta' ring
      const o = a.createOscillator(), g = a.createGain(); o.type = 'sine';
      if (low){ o.frequency.setValueAtTime(110, at); o.frequency.exponentialRampToValueAtTime(68, at+.22); }
      else { o.frequency.setValueAtTime(520, at); o.frequency.exponentialRampToValueAtTime(470, at+.12); }
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at+.005); g.gain.exponentialRampToValueAtTime(.0001, at + (low ? .38 : .18));
      o.connect(g).connect(out); o.start(at); o.stop(at+.4); nodes.push(o);
    };
    const kartal = (at, v) => {     // brass hand cymbals: bright inharmonic ring
      for (const [fq, dv] of [[3150,.6],[4420,.4],[5830,.3],[7710,.2]]){
        const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = fq;
        g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v*dv, at+.003); g.gain.exponentialRampToValueAtTime(.0001, at+.45);
        o.connect(g).connect(out); o.start(at); o.stop(at+.5); nodes.push(o);
      }
      const nz = a.createBufferSource(); nz.buffer = noiseBuf(.05); const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
      const g = a.createGain(); g.gain.setValueAtTime(v*.5, at); g.gain.exponentialRampToValueAtTime(.0001, at+.04); nz.connect(hp).connect(g).connect(out); nz.start(at); nz.stop(at+.05); nodes.push(nz);
    };
    cycles.forEach(({at, f}, ci) => {
      const loud = [.55, .8, 1][ci];
      for (let b = 0; b < 16; b++){
        const bt = t0 + (at + b*f)*beat, half = f*beat*.5;
        // kartals: ching, ching, CHANG, rest
        if (b % 4 !== 3) kartal(bt, (b % 4 === 2 ? .09 : .05) * loud);
        // mridanga: dha . ta dha | ta . dha ta
        mri(bt, b % 2 === 0, (b % 2 === 0 ? .45 : .22) * loud);
        if (ci > 0) mri(bt + half, b % 2 === 1, .16 * loud);
      }
    });
    kartal(t0 + (cycles[2].at + 16*cycles[2].f + .6)*beat, .1);
  }
  const done = setTimeout(() => stopAarti(), (total+1.8)*1000);
  return () => { clearTimeout(done); try { out.gain.cancelScheduledValues(a.currentTime); out.gain.setValueAtTime(out.gain.value, a.currentTime); out.gain.exponentialRampToValueAtTime(.0001, a.currentTime+.3); } catch(e){} setTimeout(() => nodes.forEach(o => { try { o.stop(); } catch(e){} }), 350); };
}
let aartiMode = null;
function stopAarti(){ if (aartiStop){ aartiStop(); aartiStop = null; } aartiMode = null;
  for (const id of ['m-toggle','f-toggle','b-toggle']){ $(id).classList.remove('on'); $(id).setAttribute('aria-pressed','false'); } }
function toggleAarti(mode, id, song){
  const key = mode + (song || ''); const same = aartiMode === key; stopAarti(); if (same) return;
  aartiStop = playAarti(mode, song); if (!aartiStop) return; aartiMode = key;
  $(id).classList.add('on'); $(id).setAttribute('aria-pressed','true');
}
$('m-toggle').addEventListener('click', () => toggleAarti('harmonium', 'm-toggle'));
$('f-toggle').addEventListener('click', () => toggleAarti('flute', 'f-toggle'));
$('b-toggle').addEventListener('click', () => toggleAarti('harmonium', 'b-toggle', 'mantra'));
$('s-toggle').addEventListener('click', e => {
  soundOn = !soundOn; const a = audio(); if (a && a.state === 'suspended') a.resume();
  e.currentTarget.firstChild.textContent = soundOn ? '🔊' : '🔇'; e.currentTarget.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) launch();
});

size(); requestAnimationFrame(frame);
setTimeout(() => { for (let i=0;i<5;i++) setTimeout(() => launch(), i*300); const L = layoutGround(groundInfo()); L.anar.forEach(f => anar(f)); }, 2600);
